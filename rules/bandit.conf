# NCIIPC Bandit Configuration for Security Analysis
# Focused on OWASP Top 10 and CWE-Top 25 vulnerabilities

[bandit]
# Include test IDs for high-priority security issues
tests = B101,B102,B103,B104,B105,B106,B107,B108,B110,B201,B301,B302,B303,B304,B305,B306,B307,B308,B309,B310,B311,B312,B313,B314,B315,B316,B317,B318,B319,B320,B321,B322,B323,B324,B325,B501,B502,B503,B504,B505,B506,B507,B601,B602,B603,B604,B605,B606,B607,B608,B609,B610,B611,B612,B613,B614,B615,B701,B702,B703,B704,B801

# Exclude test IDs for false positives
skips = B601,B603,B604,B605,B606,B607,B608,B609,B610,B611,B612,B613,B614,B615,B701,B702,B703,B704,B801

# Confidence levels to include
confidence = HIGH,MEDIUM

# Severity levels to include  
severity = HIGH,MEDIUM

# Output format
format = json

# Include line numbers
line_numbers = true

# Recursive directory scanning
recursive = true

# Aggressive mode for more thorough scanning
aggressive = true

# Show only issues (no informational messages)
quiet = true

# Verbose output for debugging
verbose = false

# Exclude specific directories
exclude_dirs = .git,.svn,.hg,__pycache__,*.egg-info,.venv,venv,env,.env,node_modules,build,dist

# Exclude specific files
exclude = *.pyc,*.pyo,*.pyd,*.so,*.dll,*.exe

# Custom test configuration
[test_selection]
# Include all security-related tests
include = *

# Exclude specific tests that may cause false positives
exclude = B601,B603,B604,B605,B606,B607,B608,B609,B610,B611,B612,B613,B614,B615,B701,B702,B703,B704,B801

[severity]
# Map severity levels
HIGH = ERROR
MEDIUM = WARNING
LOW = INFO

[confidence]
# Map confidence levels
HIGH = HIGH
MEDIUM = MEDIUM
LOW = LOW
